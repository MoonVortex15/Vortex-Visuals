plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Таск для автоматического расширения размера JAR-файла
task generateDynamicPayload {
    def outputDir = file("$buildDir/generated/resources")
    outputs.dir(outputDir)

    doLast {
        def payloadFile = new File(outputDir, "vortex_data.bin")
        payloadFile.parentFile.mkdirs()

        // Считаем суммарный размер всех файлов исходного кода Java
        long sourceCodeBytes = 0
        fileTree('src/main/java').each { file ->
            if (file.isFile()) {
                sourceCodeBytes += file.length()
            }
        }

        // Базовый размер 20 КБ + пропорциональное добавление байт в зависимости от объёма кода
        int basePadding = 20 * 1024
        int extraPadding = (int) (sourceCodeBytes * 2) 
        int totalBytes = basePadding + extraPadding

        byte[] dummyData = new byte[totalBytes]
        new Random(12345).nextBytes(dummyData)
        payloadFile.setBytes(dummyData)
    }
}

// Подключаем сгенерированный файл ресурсов в итоговую сборку JAR
sourceSets.main.output.dir("$buildDir/generated/resources", builtBy: generateDynamicPayload)

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename "${it}_${project.archives_base_name}"
    }
}
